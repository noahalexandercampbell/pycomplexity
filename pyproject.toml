[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycomplexity"
version = "0.1.0"
description = "AST-based cyclomatic complexity analyzer for Python source files"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ProjectCreationAgent"}]
keywords = ["complexity", "static-analysis", "ast", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
pycomplexity = "pycomplexity_cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["pycomplexity", "pycomplexity_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
